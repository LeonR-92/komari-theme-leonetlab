name: Validate And Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Select compatibility smoke scope
        id: smoke_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')
          let legacy = true
          try {
            let base = process.env.BASE_SHA
            if (process.env.GITHUB_EVENT_NAME === 'push') {
              const version = JSON.parse(readFileSync('komari-theme.json', 'utf8')).version
              const tag = execFileSync('git', ['tag', '--list', `v${version}`], { encoding: 'utf8' }).trim()
              if (!tag) {
                // A test-only retry still needs the compatibility scope of the whole release.
                const tags = execFileSync('git', ['tag', '--merged', 'HEAD', '--sort=-version:refname'], { encoding: 'utf8' })
                base = tags.split('\n').find(value => /^v\d+\.\d+\.\d+$/.test(value))
              }
            }
            if (base && !/^0+$/.test(base)) {
              const paths = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], { encoding: 'utf8' }).trim().split('\n')
              legacy = paths.some(path => /^src\/(?:utils\/(?:rpc|api|nodeResponse|.*[Mm]etric.*|.*[Hh]istory.*|.*[Pp]ing.*)\.ts|stores\/nodes\.ts|types\/)/.test(path))
            }
          }
          catch { /* Unknown comparison scope retains the oldest compatibility smoke. */ }
          console.log(`legacy=${legacy}`)
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Fail early on lockfile advisories before spending time on browser checks.
        run: npm audit --omit=dev --audit-level=high

      # Build includes Vue/TypeScript checks; reuse this exact output for all gates and publication.
      - name: Build and type-check release package
        run: npm run build

      - name: Lint
        run: |
          npm run lint
          git diff --exit-code

      - name: Validate manifest and version compatibility
        run: npm run validate

      - name: Cross-browser interaction tests
        timeout-minutes: 15
        env:
          # Keep in sync with the locked @playwright/test version. Browsers and
          # system libraries are preinstalled, so apt availability is not a release dependency.
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
        run: |
          docker run --rm --init --ipc=host \
            --user "$(id -u):$(id -g)" --env CI --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work "$PLAYWRIGHT_IMAGE" \
            node node_modules/@playwright/test/cli.js test \
              --project=chromium-desktop --project=chromium-mobile --project=webkit-tablet

      - name: Smoke test Komari 1.2.5 response rendering
        if: steps.smoke_scope.outputs.legacy == 'true'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke:1.2.5

      # Representative modern baseline and current target, not every patch tag.
      - name: Smoke test Komari 1.4.3 response rendering
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke:1.4.3

      - name: Smoke test Komari 1.6.1 response rendering
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke:1.6.1

      - name: Detect version release
        if: github.event_name == 'push'
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { existsSync, readFileSync } = require('node:fs')

          const zeroSha = '0000000000000000000000000000000000000000'
          const beforeSha = process.env.BEFORE_SHA
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          const themeJson = JSON.parse(readFileSync('komari-theme.json', 'utf8'))

          if (packageJson.themeVersion !== themeJson.version) {
            throw new Error(`Theme version mismatch: package.json.themeVersion=${packageJson.themeVersion}, komari-theme.json=${themeJson.version}`)
          }

          const currentVersion = themeJson.version
          let versionChanged = true

          if (beforeSha && beforeSha !== zeroSha) {
            try {
              const previous = JSON.parse(execFileSync('git', ['show', `${beforeSha}:komari-theme.json`], { encoding: 'utf8' }))
              versionChanged = previous.version !== currentVersion
            }
            catch {
              versionChanged = true
            }
          }

          let tagExists = true
          try {
            execFileSync('git', ['rev-parse', '--verify', '--quiet', `refs/tags/v${currentVersion}`])
          }
          catch {
            tagExists = false
          }

          const asset = `komari-theme-leonetlab-build-v${currentVersion}.zip`
          if (!existsSync(asset))
            throw new Error(`Release asset is missing: ${asset}`)

          console.log(`current_version=${currentVersion}`)
          console.log(`release_required=${versionChanged || !tagExists}`)
          console.log(`release_tag=v${currentVersion}`)
          console.log(`asset=${asset}`)
          NODE

      - name: Check release tag state
        if: github.event_name == 'push' && steps.version.outputs.release_required == 'true'
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            tag_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "${tag_sha}" != "${CURRENT_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists on ${tag_sha}, not on ${CURRENT_SHA}." >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release tag
        if: github.event_name == 'push' && steps.version.outputs.release_required == 'true' && steps.tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Create GitHub release
        if: github.event_name == 'push' && steps.version.outputs.release_required == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.current_version, '-') }}
          make_latest: ${{ contains(steps.version.outputs.current_version, '-') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.asset }}
